[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-journal-analyzer"
version = "0.2.20"
description = "CLI tool to analyze Linux journal entries and log files with AI"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.0",
]

[project.scripts]
ai-journal-analyzer = "ai_journal_analyzer:main"

[tool.hatch.build.targets.wheel]
only-include = []

[tool.hatch.build.targets.wheel.force-include]
"src/ai_journal_analyzer" = "ai_journal_analyzer.py"

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "Makefile",
    "pyproject.toml",
    "ai-journal-analyzer.conf.example",
    "src/ai_journal_analyzer",
    "scripts/install-simple.sh",
]
