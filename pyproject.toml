[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "journal-ai-analyzer"
version = "0.2.4"
description = "CLI tool to analyze Linux journal entries with AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.0",
]

[project.scripts]
journal-ai-analyzer = "journal_ai_analyzer:main"

[tool.hatch.build.targets.wheel]
only-include = []

[tool.hatch.build.targets.wheel.force-include]
"src/journal_ai_analyzer" = "journal_ai_analyzer.py"

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "LICENSE",
    "Makefile",
    "pyproject.toml",
    "journal_ai_analyzer.conf.example",
    "src/journal_ai_analyzer",
    "scripts/install-simple.sh",
]
